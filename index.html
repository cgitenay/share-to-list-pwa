<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partager vers ma liste</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px 20px;
        text-align: center;
        color: #222;
      }
      h1 {
        font-size: 18px;
      }
      #status {
        margin-top: 20px;
        font-size: 15px;
      }
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-top: 10px;
        font-size: 14px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      button {
        background: #0056a3;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      h2 {
        font-size: 15px;
        text-align: left;
        margin: 24px 0 4px;
      }
      #current-list {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        text-align: left;
      }
      #current-list li {
        padding: 8px 10px;
        border: 1px solid #eee;
        border-radius: 6px;
        margin-top: 6px;
        font-size: 14px;
        word-break: break-word;
      }
      #add-item-row {
        display: flex;
        gap: 8px;
      }
      #add-item-row input {
        margin-top: 0;
      }
      #add-item-row button {
        margin-top: 0;
        width: auto;
        flex-shrink: 0;
        padding: 10px 16px;
      }
      details {
        margin-top: 24px;
        text-align: left;
      }
      details summary {
        cursor: pointer;
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Partager vers ma liste</h1>
    <div id="status">Chargement...</div>

    <h2>Ma liste actuelle</h2>
    <button id="refresh-list">Actualiser</button>
    <ul id="current-list"></ul>

    <h2>Ajouter un article</h2>
    <div id="add-item-row">
      <input type="text" id="new-item" placeholder="Ex: lait, 2x oeufs..." />
      <button id="add-item">Ajouter</button>
    </div>

    <details id="setup">
      <summary>Reglages du relais</summary>
      <p>URL du relais Apps Script (verifie qu'elle est identique a celle
      collee dans les Reglages de l'extension) :</p>
      <input type="url" id="relay-url" placeholder="URL du Web App Apps Script" />
      <button id="save-relay">Enregistrer</button>
    </details>

    <script>
      const STORAGE_KEY = "relayUrl";
      const statusEl = document.getElementById("status");
      const relayInput = document.getElementById("relay-url");
      const saveBtn = document.getElementById("save-relay");
      const currentListEl = document.getElementById("current-list");
      const refreshListBtn = document.getElementById("refresh-list");
      const newItemInput = document.getElementById("new-item");
      const addItemBtn = document.getElementById("add-item");

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }

      const params = new URLSearchParams(location.search);
      const shared = params.get("url") || params.get("text") || "";

      function getRelayUrl() {
        return localStorage.getItem(STORAGE_KEY);
      }

      // GET avec les donnees dans l'URL plutot que POST : une requete
      // POST vers un Web App Apps Script traverse une redirection interne
      // (vers googleusercontent.com) que le navigateur suit en la
      // transformant en GET et en supprimant son corps - le POST semblait
      // reussir cote client mais Apps Script ne recevait jamais les
      // donnees.
      //
      // Meme un fetch() GET classique est bloque par le CORS sur ce
      // meme trajet de redirection (verifie : "Failed to fetch" sur cette
      // page, alors qu'une simple navigation dans la barre d'adresse
      // fonctionne - la navigation n'est jamais soumise au CORS,
      // contrairement a fetch()). On ne peut donc lire aucune reponse
      // cross-origin ici, avec ou sans "no-cors" - c'est une limite du
      // navigateur, pas un bug corrigeable cote code. On envoie via une
      // requete image (jamais soumise au CORS, technique eprouvee pour
      // "envoyer sans lire la reponse"), et on l'assume dans le message
      // affiche : succes d'envoi confirme, succes de traitement a
      // verifier dans la liste partagee/le Sheet.
      function sendToRelay(relayUrl, content, type) {
        return new Promise((resolve) => {
          const target =
            relayUrl +
            "?action=add&type=" + encodeURIComponent(type || "link") +
            "&content=" + encodeURIComponent(content);
          const img = new Image();
          img.onload = () => resolve();
          img.onerror = () => resolve(); // reponse JSON, pas une image : attendu, pas un echec
          img.src = target;
          setTimeout(resolve, 4000); // filet de securite
        });
      }

      // Lecture de la liste : contrairement a l'envoi, il faut ici
      // pouvoir lire une vraie reponse (le contenu de la liste), pas
      // juste confirmer un envoi a l'aveugle. Une balise <script src>
      // n'est jamais soumise au CORS (comme les images), donc on utilise
      // le classique JSONP : Apps Script renvoie "callback([...]);" en
      // JavaScript plutot que du JSON brut, execute directement au
      // chargement du script.
      function fetchListViaJsonp(relayUrl) {
        return new Promise((resolve, reject) => {
          const callbackName = "cdlistCb" + Date.now();
          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("Timeout"));
          }, 8000);

          function cleanup() {
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
            clearTimeout(timeout);
          }

          window[callbackName] = (data) => {
            cleanup();
            resolve(data);
          };

          const script = document.createElement("script");
          script.src = relayUrl + "?action=list&callback=" + callbackName;
          script.onerror = () => {
            cleanup();
            reject(new Error("Erreur de chargement"));
          };
          document.body.appendChild(script);
        });
      }

      async function refreshCurrentList() {
        const relayUrl = getRelayUrl();
        if (!relayUrl) {
          currentListEl.innerHTML = "<li>Configure d'abord le relais ci-dessous.</li>";
          return;
        }
        currentListEl.innerHTML = "<li>Chargement...</li>";
        try {
          const rows = await fetchListViaJsonp(relayUrl);
          if (!rows || rows.length === 0) {
            currentListEl.innerHTML = "<li>Rien en attente.</li>";
            return;
          }
          currentListEl.innerHTML = "";
          rows.forEach((r) => {
            const li = document.createElement("li");
            li.textContent = (r.type === "link" ? "🔗 " : "🛒 ") + r.content;
            currentListEl.appendChild(li);
          });
        } catch (err) {
          currentListEl.innerHTML = "<li>Erreur : " + err.message + "</li>";
        }
      }

      refreshListBtn.addEventListener("click", refreshCurrentList);

      addItemBtn.addEventListener("click", async () => {
        const relayUrl = getRelayUrl();
        const text = newItemInput.value.trim();
        if (!relayUrl) {
          statusEl.textContent = "Configure d'abord le relais ci-dessous.";
          return;
        }
        if (!text) return;

        addItemBtn.disabled = true;
        try {
          await sendToRelay(relayUrl, text, "item");
          newItemInput.value = "";
          statusEl.textContent = "Article ajoute.";
          refreshCurrentList();
        } catch (err) {
          statusEl.textContent = "Erreur : " + err.message;
        } finally {
          addItemBtn.disabled = false;
        }
      });

      relayInput.value = getRelayUrl() || "";

      async function handleShare() {
        const relayUrl = getRelayUrl();
        if (!relayUrl) {
          statusEl.textContent = shared
            ? "Configure d'abord le relais ci-dessous, puis repartage ce lien."
            : "Configure le relais ci-dessous pour commencer.";
          return;
        }

        if (!shared) {
          statusEl.textContent = "Aucun lien recu. Ouvre cette page depuis le menu \"Partager\" d'une appli.";
          return;
        }

        statusEl.textContent = "Envoi...";
        try {
          await sendToRelay(relayUrl, shared);
          statusEl.textContent = "Envoye - verifie ta liste partagee pour confirmer.";
        } catch (err) {
          statusEl.textContent = "Erreur : " + err.message;
        }
      }

      saveBtn.addEventListener("click", () => {
        const url = relayInput.value.trim();
        if (!url) return;
        localStorage.setItem(STORAGE_KEY, url);
        statusEl.textContent = "URL enregistree.";
        handleShare();
        refreshCurrentList();
      });

      handleShare();
      refreshCurrentList();
    </script>
  </body>
</html>
