<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partager vers ma liste</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px 20px;
        text-align: center;
        color: #222;
      }
      h1 {
        font-size: 18px;
      }
      #status {
        margin-top: 20px;
        font-size: 15px;
      }
      input,
      button,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-top: 10px;
        font-size: 14px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      button {
        background: #0056a3;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      button.secondary {
        background: #999;
      }
      button:disabled {
        background: #9bb7ce;
        cursor: default;
      }
      h2 {
        font-size: 15px;
        text-align: left;
        margin: 24px 0 4px;
      }
      section {
        text-align: left;
      }
      #current-list {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        text-align: left;
      }
      #current-list li {
        padding: 8px 10px;
        border: 1px solid #eee;
        border-radius: 6px;
        margin-top: 6px;
        font-size: 14px;
        word-break: break-word;
      }
      #add-item-row {
        display: flex;
        gap: 8px;
      }
      #add-item-row input {
        margin-top: 0;
      }
      #add-item-row button {
        margin-top: 0;
        width: auto;
        flex-shrink: 0;
        padding: 10px 16px;
      }
      #auth-status {
        font-size: 14px;
      }
      #invite-code-display {
        margin-top: 8px;
        font-size: 14px;
        font-weight: bold;
        word-break: break-all;
      }
      a.new-recipe {
        display: block;
        text-align: center;
        margin-top: 24px;
        padding: 10px;
        border-radius: 6px;
        background: #2f8f4e;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Partager vers ma liste</h1>
    <div id="status">Chargement...</div>

    <section>
      <h2>Compte</h2>
      <div id="auth-status">Non connecte.</div>
      <button id="sign-in">Se connecter avec Google</button>
      <button id="sign-out" class="secondary" hidden>Se deconnecter</button>
    </section>

    <section id="group-section" hidden>
      <h2>Groupe</h2>
      <select id="group-select"></select>
      <button id="create-group">Creer un nouveau groupe</button>
      <input type="text" id="join-code" placeholder="Code d'invitation" />
      <button id="join-group">Rejoindre avec ce code</button>
      <button id="invite-btn" class="secondary">Generer un code d'invitation</button>
      <div id="invite-code-display"></div>
    </section>

    <section>
      <h2>Ma liste actuelle</h2>
      <button id="refresh-list" class="secondary">Actualiser</button>
      <ul id="current-list"></ul>
    </section>

    <section>
      <h2>Ajouter un article</h2>
      <div id="add-item-row">
        <input type="text" id="new-item" placeholder="Ex: lait, 2x oeufs..." />
        <button id="add-item">Ajouter</button>
      </div>
    </section>

    <a class="new-recipe" href="recipes.html">📖 Mes recettes</a>

    <script src="matcher.js"></script>
    <script type="module">
      import { auth, db } from "./firebase-init.js";
      import {
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
      import {
        collection,
        addDoc,
        getDocs,
        query,
        where,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
      import {
        myGroups,
        createGroup,
        createInvite,
        joinGroupWithCode,
        getGroupInfo,
        getActiveGroupId,
        setActiveGroupId,
      } from "./groups.js";
      import { extractRecipeFromUrl } from "./recipe-extractor.js";

      const PENDING_SHARE_KEY = "pendingShare";
      const RECIPE_DRAFT_KEY = "recipeDraft";

      const statusEl = document.getElementById("status");
      const authStatusEl = document.getElementById("auth-status");
      const signInBtn = document.getElementById("sign-in");
      const signOutBtn = document.getElementById("sign-out");
      const groupSectionEl = document.getElementById("group-section");
      const groupSelectEl = document.getElementById("group-select");
      const createGroupBtn = document.getElementById("create-group");
      const joinCodeInput = document.getElementById("join-code");
      const joinGroupBtn = document.getElementById("join-group");
      const inviteBtn = document.getElementById("invite-btn");
      const inviteCodeDisplay = document.getElementById("invite-code-display");
      const currentListEl = document.getElementById("current-list");
      const refreshListBtn = document.getElementById("refresh-list");
      const newItemInput = document.getElementById("new-item");
      const addItemBtn = document.getElementById("add-item");

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }

      // Le lien/texte partage arrive en parametres d'URL (share_target du
      // manifest). On le range tout de suite dans localStorage : si
      // l'utilisateur doit d'abord se connecter, signInWithRedirect quitte
      // et revient sur cette page SANS ces parametres d'URL - seul un
      // stockage local survit a l'aller-retour.
      const params = new URLSearchParams(location.search);
      const sharedNow = params.get("url") || params.get("text") || "";
      if (sharedNow) {
        localStorage.setItem(PENDING_SHARE_KEY, sharedNow);
      }

      function shoppingItemsRef(groupId) {
        return collection(db, "groups", groupId, "shoppingItems");
      }

      async function addSharedItem(groupId, user, type, content) {
        await addDoc(shoppingItemsRef(groupId), {
          type: type === "link" ? "link" : "item",
          content,
          status: "pending",
          addedBy: user.uid,
          createdAt: serverTimestamp(),
        });
      }

      async function refreshCurrentList() {
        const groupId = getActiveGroupId();
        if (!auth.currentUser || !groupId) {
          currentListEl.innerHTML = "<li>Connecte-toi et choisis un groupe.</li>";
          return;
        }
        currentListEl.innerHTML = "<li>Chargement...</li>";
        try {
          const snap = await getDocs(
            query(shoppingItemsRef(groupId), where("status", "==", "pending"))
          );
          if (snap.empty) {
            currentListEl.innerHTML = "<li>Rien en attente.</li>";
            return;
          }
          currentListEl.innerHTML = "";
          snap.forEach((d) => {
            const r = d.data();
            const li = document.createElement("li");
            li.textContent = (r.type === "link" ? "🔗 " : "🛒 ") + r.content;
            currentListEl.appendChild(li);
          });
        } catch (err) {
          currentListEl.innerHTML = "<li>Erreur : " + err.message + "</li>";
        }
      }

      refreshListBtn.addEventListener("click", refreshCurrentList);

      addItemBtn.addEventListener("click", async () => {
        const groupId = getActiveGroupId();
        const text = newItemInput.value.trim();
        if (!auth.currentUser || !groupId) {
          statusEl.textContent = "Connecte-toi et choisis un groupe d'abord.";
          return;
        }
        if (!text) return;

        addItemBtn.disabled = true;
        try {
          await addSharedItem(groupId, auth.currentUser, "item", text);
          newItemInput.value = "";
          statusEl.textContent = "Article ajoute.";
          refreshCurrentList();
        } catch (err) {
          statusEl.textContent = "Erreur : " + err.message;
        } finally {
          addItemBtn.disabled = false;
        }
      });

      function looksLikeUrl(str) {
        try {
          const u = new URL(str.trim());
          return u.protocol === "http:" || u.protocol === "https:";
        } catch (err) {
          return false;
        }
      }

      // Un lien partage declenche desormais l'extraction de recette
      // (nom + ingredients) et ouvre le formulaire de revue/enregistrement,
      // plutot que d'etre simplement mis en attente pour l'extension - le
      // partage d'un simple texte (pas une URL) reste ajoute directement a
      // la liste de courses.
      async function handleShare() {
        const shared = localStorage.getItem(PENDING_SHARE_KEY);
        const groupId = getActiveGroupId();

        if (!auth.currentUser) {
          statusEl.textContent = shared
            ? "Connecte-toi avec Google ci-dessous, puis reviens ici pour traiter ce partage."
            : "Connecte-toi avec Google pour commencer.";
          return;
        }
        if (!groupId) {
          statusEl.textContent = "Cree ou rejoins un groupe ci-dessous.";
          return;
        }
        if (!shared) {
          statusEl.textContent = "Aucun lien recu. Ouvre cette page depuis le menu \"Partager\" d'une appli.";
          return;
        }

        if (looksLikeUrl(shared)) {
          statusEl.textContent = "Extraction de la recette...";
          const result = await extractRecipeFromUrl(shared);
          localStorage.removeItem(PENDING_SHARE_KEY);
          localStorage.setItem(
            RECIPE_DRAFT_KEY,
            JSON.stringify({
              name: result.ok ? result.name : null,
              ingredients: result.ok && result.ingredients ? result.ingredients : [],
              sourceUrl: shared,
              message: result.ok
                ? result.ingredients
                  ? null
                  : "Rien detecte automatiquement - complete les ingredients a la main."
                : result.message,
            })
          );
          location.href = "recipe-form.html";
          return;
        }

        statusEl.textContent = "Envoi...";
        try {
          await addSharedItem(groupId, auth.currentUser, "item", shared);
          localStorage.removeItem(PENDING_SHARE_KEY);
          statusEl.textContent = "Envoye - visible dans ta liste ci-dessous.";
          refreshCurrentList();
        } catch (err) {
          statusEl.textContent = "Erreur : " + err.message;
        }
      }

      // =====================================================================
      // Compte et groupe (Firebase Authentication + Firestore)
      // =====================================================================

      async function refreshAuthUI() {
        const user = auth.currentUser;
        if (!user) {
          authStatusEl.textContent = "Non connecte.";
          signInBtn.hidden = false;
          signOutBtn.hidden = true;
          groupSectionEl.hidden = true;
          return;
        }

        authStatusEl.textContent = "Connecte : " + (user.displayName || user.email || user.uid);
        signInBtn.hidden = true;
        signOutBtn.hidden = false;
        groupSectionEl.hidden = false;
        await refreshGroupList();
      }

      async function refreshGroupList() {
        const user = auth.currentUser;
        if (!user) return;

        const groups = await myGroups(user.uid);
        groupSelectEl.innerHTML = "";

        if (groups.length === 0) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "Aucun groupe - cree ou rejoins-en un";
          groupSelectEl.appendChild(opt);
          return;
        }

        const activeId = getActiveGroupId();
        for (const g of groups) {
          const info = await getGroupInfo(g.groupId);
          const opt = document.createElement("option");
          opt.value = g.groupId;
          opt.textContent = (info && info.name) || g.groupId;
          if (g.groupId === activeId) opt.selected = true;
          groupSelectEl.appendChild(opt);
        }

        if (!activeId) {
          setActiveGroupId(groups[0].groupId);
        }
      }

      signInBtn.addEventListener("click", async () => {
        // Google bloque volontairement l'affichage de son ecran de
        // connexion dans une PWA installee en mode standalone (mesure
        // anti-phishing, pas un bug corrigeable ici) : la page de
        // connexion se coupe avant d'avoir fini de charger. Il faut
        // ouvrir cette page dans un onglet Chrome normal pour se
        // connecter la premiere fois - la session est ensuite retrouvee
        // automatiquement dans l'app installee (meme profil Chrome).
        const isStandalone = window.matchMedia("(display-mode: standalone)").matches;
        if (isStandalone) {
          statusEl.textContent =
            "Google bloque la connexion dans l'appli installee. Ouvre " +
            location.href.split("?")[0] +
            " dans un onglet Chrome normal (pas l'icone installee), " +
            "connecte-toi une fois, puis reviens ici.";
          return;
        }

        // signInWithRedirect a ete abandonne : son retour repose sur une
        // iframe cachee cross-origin (authDomain firebaseapp.com != domaine
        // d'hebergement github.io) pour relayer le resultat, bloquee
        // silencieusement par le partitionnement du stockage tiers des
        // navigateurs recents (echec confirme sur Chrome ET Brave, sans
        // aucune erreur visible). signInWithPopup communique directement
        // entre la fenetre popup et la page, sans ce relais fragile.
        signInBtn.disabled = true;
        statusEl.textContent = "Connexion...";
        try {
          await signInWithPopup(auth, new GoogleAuthProvider());
          await refreshAuthUI();
          statusEl.textContent = "Connecte.";
          handleShare();
          refreshCurrentList();
        } catch (err) {
          statusEl.textContent = "Erreur de connexion (" + err.code + ") : " + err.message;
        } finally {
          signInBtn.disabled = false;
        }
      });

      signOutBtn.addEventListener("click", async () => {
        await signOut(auth);
        await refreshAuthUI();
        statusEl.textContent = "Deconnecte.";
      });

      groupSelectEl.addEventListener("change", async () => {
        if (!groupSelectEl.value) return;
        setActiveGroupId(groupSelectEl.value);
        statusEl.textContent = "Groupe actif change.";
        inviteCodeDisplay.textContent = "";
        refreshCurrentList();
      });

      createGroupBtn.addEventListener("click", async () => {
        const user = auth.currentUser;
        if (!user) return;

        const name = prompt("Nom du groupe ?", "Ma liste");
        if (name === null) return;

        createGroupBtn.disabled = true;
        try {
          const groupId = await createGroup(user, name);
          setActiveGroupId(groupId);
          await refreshGroupList();
          statusEl.textContent = "Groupe cree.";
          handleShare();
        } catch (err) {
          statusEl.textContent = "Erreur : " + err.message;
        } finally {
          createGroupBtn.disabled = false;
        }
      });

      joinGroupBtn.addEventListener("click", async () => {
        const user = auth.currentUser;
        const code = joinCodeInput.value.trim();
        if (!user || !code) return;

        joinGroupBtn.disabled = true;
        try {
          const groupId = await joinGroupWithCode(user, code);
          setActiveGroupId(groupId);
          await refreshGroupList();
          joinCodeInput.value = "";
          statusEl.textContent = "Groupe rejoint.";
          handleShare();
        } catch (err) {
          statusEl.textContent = "Erreur : " + err.message;
        } finally {
          joinGroupBtn.disabled = false;
        }
      });

      inviteBtn.addEventListener("click", async () => {
        const user = auth.currentUser;
        const groupId = getActiveGroupId();
        if (!user || !groupId) return;

        inviteBtn.disabled = true;
        try {
          const code = await createInvite(user, groupId);
          inviteCodeDisplay.textContent = "Code : " + code;
        } catch (err) {
          statusEl.textContent = "Erreur : " + err.message;
        } finally {
          inviteBtn.disabled = false;
        }
      });

      // Reagit a une session deja persistee (retour sur la page apres
      // connexion, ou reouverture ulterieure) - la connexion initiale
      // elle-meme se fait via signInWithPopup, gere dans le handler
      // signInBtn ci-dessus.
      onAuthStateChanged(auth, async (user) => {
        await refreshAuthUI();
        handleShare();
        if (user) refreshCurrentList();
      });
    </script>
  </body>
</html>
